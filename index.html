<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM 출시 타임라인 (2026)</title>
  <meta name="description" content="2026년 파운데이션 모델 출시 타임라인">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-title-group">
      <h1 class="header-title">LLM 출시 타임라인 (2026)</h1>
      <p class="header-subtitle" id="header-subtitle">2026년 1월 1일 ~ 9월 4일 주요 파운데이션 모델 123개 출시 순서</p>
    </div>

    <div class="header-controls">
      <!-- Search Input -->
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="모델명 또는 기업 검색..." 
          oninput="handleSearch(this.value)"
        >
        <button id="search-clear-btn" class="search-clear hidden" onclick="clearSearch()">✕</button>
      </div>

      <!-- Comparison Launch Button -->
      <button class="nav-btn" onclick="openCompareModal()" style="border: 1px solid #111827; background: #111827; color: #ffffff; border-radius: 6px; padding: 6px 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;" title="두 모델 벤치마크 및 스펙 직접 비교">
        <span>⚖️</span>
        <span>두 모델 비교</span>
      </button>

      <!-- Sort Order Toggle Button -->
      <button id="sort-toggle-btn" class="nav-btn" onclick="toggleSortOrder()" style="border: 1px solid #d1d5db; border-radius: 6px; padding: 6px 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; background: #f9fafb;" title="출시 순서 전환 (최신순 ⇄ 과거순)">
        <span id="sort-toggle-icon">↓</span>
        <span id="sort-toggle-label">최신순 (9월→1월)</span>
      </button>

      <!-- Left / Right Scroll Buttons -->
      <div class="nav-button-group">
        <button class="nav-btn" onclick="scrollTimeline(-1)" title="이전으로 스크롤">← 이전</button>
        <button class="nav-btn" onclick="scrollTimeline(1)" title="다음으로 스크롤">다음 →</button>
      </div>

      <!-- GitHub Link -->
      <a href="https://github.com/hojin12312/llm-timeline" target="_blank" rel="noopener noreferrer" class="github-link">
        GitHub
      </a>
    </div>
  </header>

  <!-- Month Navigation Subbar -->
  <div class="month-subbar">
    <div class="month-buttons">
      <button class="month-btn active" data-month="all" onclick="jumpToMonth('all')">전체 (123)</button>
      <button class="month-btn" data-month="2026-01" onclick="jumpToMonth('2026-01')">1월</button>
      <button class="month-btn" data-month="2026-02" onclick="jumpToMonth('2026-02')">2월</button>
      <button class="month-btn" data-month="2026-03" onclick="jumpToMonth('2026-03')">3월</button>
      <button class="month-btn" data-month="2026-04" onclick="jumpToMonth('2026-04')">4월</button>
      <button class="month-btn" data-month="2026-05" onclick="jumpToMonth('2026-05')">5월</button>
      <button class="month-btn" data-month="2026-06" onclick="jumpToMonth('2026-06')">6월</button>
      <button class="month-btn" data-month="2026-07" onclick="jumpToMonth('2026-07')">7월</button>
      <button class="month-btn" data-month="2026-08" onclick="jumpToMonth('2026-08')">8월</button>
      <button class="month-btn" data-month="2026-09" onclick="jumpToMonth('2026-09')">9월</button>
    </div>

    <div class="scroll-hint">
      마우스 휠이나 트랙패드로 좌우 스크롤 가능 · 카드의 <strong>[+ 비교]</strong>로 두 모델 선택 가능
    </div>
  </div>

  <!-- Main Horizontal Timeline Viewport -->
  <main class="timeline-viewport" id="timeline-scroll-container">
    <div class="timeline-track" id="timeline-track-inner">
      <!-- Continuous horizontal line & date columns rendered by app.js -->
    </div>
  </main>

  <!-- Floating Comparison Dock -->
  <div id="compare-dock" class="compare-dock hidden">
    <span style="font-size: 12px; font-weight: 700; color: #111827;">⚖️ 비교할 모델 (<span id="compare-count">0</span>/2):</span>
    <div id="compare-dock-items" style="display: flex; gap: 8px;"></div>
    <button class="btn-primary" onclick="openCompareModal()" id="btn-dock-compare" disabled style="opacity: 0.5;">상호 비교하기</button>
    <button class="nav-btn" onclick="clearCompareList()" style="font-size: 11px;">초기화</button>
  </div>

  <!-- Detail Modal -->
  <div id="model-modal" class="modal-overlay hidden" onclick="handleModalBackdropClick(event)">
    <div id="modal-content-card" class="modal-card" onclick="event.stopPropagation()">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Model Benchmark Comparison Modal -->
  <div id="compare-modal" class="modal-overlay hidden" onclick="handleCompareBackdropClick(event)">
    <div id="compare-modal-content" class="compare-modal-card" onclick="event.stopPropagation()">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
